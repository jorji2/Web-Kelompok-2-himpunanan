<main class="stage">
  <div class="head"><h1>Contoh Soal Himpunan</h1>
  <p>Set <b id="setNo">1</b> &middot; 5 pilihan ganda + 5 isian. Untuk isian, tulis himpunan seperti <code>{1,2,3}</code>, himpunan kosong seperti <code>{}</code>, atau angka untuk jumlah.</p>
  <div class="bar"><div id="fill"></div></div><small id="prog">Terjawab 0 dari 10</small></div>
  <form id="quiz"></form>
  <div class="actions"><button id="cek" class="btn">Periksa jawaban</button><button id="baru" class="btn alt" hidden>Buat 10 soal baru</button></div>
  <div id="hasil" class="hasil" hidden></div>
</main>
